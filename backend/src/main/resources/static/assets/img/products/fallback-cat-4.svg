<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg4)" rx="16"/>

  <!-- Border -->
  <rect x="2" y="2" width="196" height="196" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.2" rx="15"/>

  <!-- Icon group -->
  <g>
      <!-- baby bottle -->
      <rect x="86" y="72" width="28" height="52" rx="10" fill="#0ea5e9" opacity=".9"/>
      <rect x="90" y="60" width="20" height="16" rx="4" fill="#7dd3fc"/>
      <ellipse cx="100" cy="60" rx="10" ry="5" fill="#bae6fd"/>
      <rect x="90" y="88" width="20" height="4" rx="2" fill="white" opacity=".5"/>
      <!-- duck -->
      <ellipse cx="148" cy="118" rx="18" ry="14" fill="#fbbf24"/>
      <ellipse cx="158" cy="108" rx="12" ry="10" fill="#fbbf24"/>
      <ellipse cx="164" cy="107" rx="4" ry="3" fill="#f97316"/>
      <circle cx="161" cy="105" r="2" fill="#1e293b"/>
  </g>

  <!-- Category label band -->
  <rect x="0" y="158" width="200" height="42" rx="0" fill="#0284c7" opacity=".92"/>
  <rect x="0" y="158" width="200" height="42" rx="0" fill="url(#bg4)" opacity=".1"/>

  <!-- Category name (auto-wrap via 2 lines max) -->
  <text
    x="100" y="175"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="10"
    font-weight="600"
    text-anchor="middle"
    fill="white"
    opacity=".95"
  >Bébé & Puériculture</text>
  
</svg>