    opacity=".95"
  >Épicerie Salée & Conse</text>
  <text x="100" y="189" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="white" opacity=".95">rves</text>
