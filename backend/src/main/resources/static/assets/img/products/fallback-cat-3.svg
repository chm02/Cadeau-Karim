<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg3)" rx="16"/>

  <!-- Border -->
  <rect x="2" y="2" width="196" height="196" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.2" rx="15"/>

  <!-- Icon group -->
  <g>
      <!-- sausage link -->
      <ellipse cx="78" cy="115" rx="22" ry="14" fill="#f43f5e" opacity=".9"/>
      <ellipse cx="108" cy="108" rx="22" ry="14" fill="#e11d48"/>
      <ellipse cx="136" cy="115" rx="22" ry="14" fill="#f43f5e" opacity=".9"/>
      <!-- halal star -->
      <circle cx="122" cy="90" r="12" fill="#be123c"/>
      <text x="122" y="95" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">ح</text>
  </g>

  <!-- Category label band -->
  <rect x="0" y="158" width="200" height="42" rx="0" fill="#e11d48" opacity=".92"/>
  <rect x="0" y="158" width="200" height="42" rx="0" fill="url(#bg3)" opacity=".1"/>

  <!-- Category name (auto-wrap via 2 lines max) -->
  <text
    x="100" y="175"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="10"
    font-weight="600"
    text-anchor="middle"
    fill="white"
    opacity=".95"
  >Charcuterie Halal</text>
  
</svg>