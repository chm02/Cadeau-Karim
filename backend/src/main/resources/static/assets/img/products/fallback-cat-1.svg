<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg1)" rx="16"/>

  <!-- Border -->
  <rect x="2" y="2" width="196" height="196" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.2" rx="15"/>

  <!-- Icon group -->
  <g>
      <!-- milk carton -->
      <rect x="68" y="72" width="64" height="76" rx="6" fill="#f97316" opacity=".9"/>
      <polygon points="68,72 100,52 132,72" fill="#fb923c"/>
      <rect x="80" y="88" width="40" height="22" rx="4" fill="white" opacity=".9"/>
      <text x="100" y="104" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#c2410c">LAIT</text>
      <!-- egg -->
      <ellipse cx="148" cy="115" rx="14" ry="17" fill="#fef3c7"/>
      <ellipse cx="148" cy="115" rx="14" ry="17" fill="none" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Category label band -->
  <rect x="0" y="158" width="200" height="42" rx="0" fill="#f97316" opacity=".92"/>
  <rect x="0" y="158" width="200" height="42" rx="0" fill="url(#bg1)" opacity=".1"/>

  <!-- Category name (auto-wrap via 2 lines max) -->
  <text
    x="100" y="175"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="10"
    font-weight="600"
    text-anchor="middle"
    fill="white"
    opacity=".95"
  >Produits Laitiers & Œu</text>
  <text x="100" y="189" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="white" opacity=".95">fs</text>
</svg>