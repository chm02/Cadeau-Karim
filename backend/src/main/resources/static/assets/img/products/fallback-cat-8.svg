<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg8)" rx="16"/>

  <!-- Border -->
  <rect x="2" y="2" width="196" height="196" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-opacity="0.2" rx="15"/>

  <!-- Icon group -->
  <g>
      <!-- shampoo bottle -->
      <rect x="70" y="80" width="36" height="64" rx="10" fill="#16a34a"/>
      <rect x="76" y="68" width="24" height="16" rx="5" fill="#15803d"/>
      <rect x="78" y="72" width="20" height="6"  rx="3" fill="#bbf7d0"/>
      <rect x="76" y="98" width="24" height="16" rx="3" fill="white" opacity=".8"/>
      <!-- soap bubble -->
      <circle cx="142" cy="90"  r="18" fill="#4ade80" opacity=".5"/>
      <circle cx="155" cy="108" r="14" fill="#86efac" opacity=".5"/>
      <circle cx="138" cy="112" r="10" fill="#bbf7d0" opacity=".6"/>
      <circle cx="148" cy="95"  r="5"  fill="white"   opacity=".6"/>
  </g>

  <!-- Category label band -->
  <rect x="0" y="158" width="200" height="42" rx="0" fill="#16a34a" opacity=".92"/>
  <rect x="0" y="158" width="200" height="42" rx="0" fill="url(#bg8)" opacity=".1"/>

  <!-- Category name (auto-wrap via 2 lines max) -->
  <text
    x="100" y="175"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="10"
    font-weight="600"
    text-anchor="middle"
    fill="white"
    opacity=".95"
  >Hygiène Corporelle</text>
  
</svg>